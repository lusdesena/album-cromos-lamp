name: CI
on:
  push:
    branches: [v2/containerize]
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes markdownlint-cli2 "**/*.md"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target builder .
  